[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant"
version = "2026.5.0.dev0"
license = "Apache-2.0"
license-files = ["LICENSE*", "homeassistant/backports/LICENSE*"]
description = "Open-source home automation platform running on Python 3."
readme = "README.rst"
authors = [
  { name = "The Home Assistant Authors", email = "hello@home-assistant.io" },
]
keywords = ["home", "automation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]
requires-python = ">=3.14.2"
dependencies = [
  "aiodns==4.0.0",
  # aiogithubapi is needed by frontend; frontend is unconditionally imported at
  # module level in `bootstrap.py` and its requirements thus need to be in
  # requirements.txt to ensure they are always installed
  "aiogithubapi==26.0.0",
  "aiohttp==3.13.5",
  "aiohttp_cors==0.8.1",
  "aiohttp-fast-zlib==0.3.0",
  "aiohttp-asyncmdnsresolver==0.1.1",
  "aiozoneinfo==0.2.3",
  "annotatedyaml==1.0.2",
  "astral==2.2",
  "async-interrupt==1.2.2",
  "attrs==26.1.0",
  "atomicwrites-homeassistant==1.4.1",
  "audioop-lts==0.2.2",
  "awesomeversion==25.8.0",
  "bcrypt==5.0.0",
  "certifi>=2021.5.30",
  "ciso8601==2.3.3",
  "cronsim==2.7",
  "fnv-hash-fast==2.0.2",
  # hass-nabucasa is imported by helpers which don't depend on the cloud
  # integration
  "hass-nabucasa==2.2.0",
  # When bumping httpx, please check the version pins of
  # httpcore, anyio, and h11 in gen_requirements_all
  "httpx==0.28.1",
  "home-assistant-bluetooth==2.0.0",
  "ifaddr==0.2.0",
  "Jinja2==3.1.6",
  "lru-dict==1.4.1",
  "PyJWT==2.12.1",
  # PyJWT has loose dependency. We want the latest one.
  "cryptography==46.0.7",
  "Pillow==12.2.0",
  "propcache==0.4.1",
  "pyOpenSSL==26.0.0",
  "orjson==3.11.8",
  "packaging>=23.1",
  "psutil-home-assistant==0.0.1",
  "python-slugify==8.0.4",
  "PyYAML==6.0.3",
  "requests==2.33.1",
  "securetar==2026.4.1",
  "SQLAlchemy==2.0.49",
  "standard-aifc==3.13.0",
  "standard-telnetlib==3.13.0",
  "typing-extensions>=4.15.0,<5.0",
  "ulid-transform==2.2.0",
  "urllib3>=2.0",
  "uv==0.11.6",
  "voluptuous==0.15.2",
  "voluptuous-serialize==2.7.0",
  "voluptuous-openapi==0.3.0",
  "yarl==1.23.0",
  "webrtc-models==0.3.0",
  "zeroconf==0.148.0",
  "moehlenhoff-alpha2==1.4.0",
  "mullvad-api==1.0.0",
  "python-mystrom==2.5.0",
  "phone-modem==0.1.1",
]

[project.urls]
"Homepage" = "https://www.home-assistant.io/"
"Source Code" = "https://github.com/home-assistant/core"
"Bug Reports" = "https://github.com/home-assistant/core/issues"
"Docs: Dev" = "https://developers.home-assistant.io/"
"Discord" = "https://www.home-assistant.io/join-chat/"
"Forum" = "https://community.home-assistant.io/"

[project.scripts]
hass = "homeassistant.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["homeassistant*"]

[tool.pylint.MAIN]
py-version = "3.14"
# Use a conservative default here; 2 should speed up most setups and not hurt
# any too bad. Override on command line as appropriate.
jobs = 2
init-hook = """\
    from pathlib import Path; \
    import sys; \

    from pylint.config import find_default_config_files; \

    sys.path.append( \
        str(Path(next(find_default_config_files())).parent.joinpath('pylint/plugins'))
    ) \
    """
load-plugins = [
  "pylint.extensions.code_style",
  "pylint.extensions.typing",
  "hass_async_load_fixtures",
  "hass_decorator",
  "hass_enforce_class_module",
  "hass_enforce_greek_micro_char",
  "hass_enforce_sorted_platforms",
  "hass_enforce_super_call",
  "hass_enforce_type_hints",
  "hass_inheritance",
  "hass_imports",
  "hass_logger",
  "pylint_per_file_ignores",
]
persistent = false
extension-pkg-allow-list = [
  "av.audio.stream",
  "av.logging",
  "av.stream",
  "ciso8601",
  "orjson",
  "cv2",
]
fail-on = ["I"]

[tool.pylint.BASIC]
class-const-naming-style = "any"

[tool.pylint."MESSAGES CONTROL"]
# Reasons disabled:
# format - handled by ruff
# locally-disabled - it spams too much
# duplicate-code - unavoidable
# cyclic-import - doesn't test if both import on load
# abstract-class-little-used - prevents from setting right foundation
# unused-argument - generic callbacks and setup methods create a lot of warnings
# too-many-* - are not enforced for the sake of readability
# too-few-* - same as too-many-*
# abstract-method - with intro of async there are always methods missing
# inconsistent-return-statements - doesn't handle raise
# too-many-ancestors - it's too strict.
# wrong-import-order - isort guards this
# possibly-used-before-assignment - too many errors / not necessarily issues
